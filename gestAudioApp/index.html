<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Heart of Glass</title>
    <!-- Styles CSS - Minimal pour le débogage -->
    <link rel="stylesheet" href="assets/css/main.css">
    <!-- Commentez temporairement ces styles pour le débogage -->
    <!-- <link rel="stylesheet" href="assets/css/narrative.css"> -->
    <!-- <link rel="stylesheet" href="assets/css/loading.css"> -->
    
    <style>
        /* Styles minimes en ligne pour le débogage */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease-out;
        }
        
        .loading-screen.fade-out {
            opacity: 0;
        }
        
        .debug-info {
            position: fixed;
            top: 50px;
            right: 10px;
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 10001;
        }
    </style>
</head>
<body>
    <!-- Bouton plein écran -->
    <div id="fullscreen-btn" style="position: fixed; top: 10px; right: 10px; z-index: 10001; padding: 5px 10px; background-color: #3498db; color: white; cursor: pointer; border-radius: 4px;">
        Plein écran
    </div>
    
    <!-- Info de débogage -->
    <div class="debug-info">
        Heart of Glass - Mode Débogage <br>
        <span id="app-status">Initialisation...</span>
    </div>
    
    <div class="app-container">
        <header class="app-header">
            <h1>Heart of Glass</h1>
            <nav class="tab-navigation">
                <button class="tab-button active" data-tab="mainTab">Accueil</button>
                <button class="tab-button" data-tab="soundTab">Audio</button>
                <button class="tab-button" data-tab="bluetoothTab">Bluetooth</button>
            </nav>
        </header>
        
        <main class="app-content">
            <div id="mainTab" class="tab-content active">
                <!-- Contenu principal / narratif -->
                <div id="debug-main" style="margin: 20px; padding: 20px; background-color: #f0f0f0; border-radius: 5px;">
                    <h2>Accueil - Mode Débogage</h2>
                    <p>Version d'affichage simplifiée pour débogage. Cet écran est affiché pour tester le fonctionnement de base.</p>
                </div>
            </div>
            <div id="soundTab" class="tab-content">
                <!-- Contrôles audio -->
                <h2>Contrôle Audio</h2>
                <div class="audio-controls">
                    <div class="file-input-container">
                        <label for="audioFileInput">Sélectionner un fichier audio</label>
                        <input type="file" id="audioFileInput" accept="audio/*" />
                    </div>
                </div>
                <div id="audioVisualization" class="visualization-container"></div>
            </div>
            <div id="bluetoothTab" class="tab-content">
                <!-- Contrôles Bluetooth -->
                <h2>Connexion Bluetooth</h2>
                <div class="bluetooth-controls">
                    <button id="scanButton">Rechercher des capteurs</button>
                    <div id="deviceList"></div>
                </div>
                <div id="sensorVisualization" class="visualization-container"></div>
            </div>
        </main>
    </div>
    
    <!-- Script principal -->
    <script src="src/renderer/renderer.js"></script>
    
    <!-- Script pour le bouton plein écran -->
    <script>
        // Activer le plein écran manuellement
        document.getElementById('fullscreen-btn').addEventListener('click', function() {
            try {
                const electron = require('electron');
                const remote = electron.remote;
                if (remote && remote.getCurrentWindow) {
                    const win = remote.getCurrentWindow();
                    win.setFullScreen(!win.isFullScreen());
                    this.textContent = win.isFullScreen() ? 'Quitter plein écran' : 'Plein écran';
                } else {
                    console.error('Remote module not available. Using fallback...');
                    // Fallback avec l'API HTML5 standard
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(err => {
                            console.error(`Error attempting to enable full-screen mode: ${err.message}`);
                        });
                        this.textContent = 'Quitter plein écran';
                    } else {
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                            this.textContent = 'Plein écran';
                        }
                    }
                }
            } catch (error) {
                console.error('Erreur lors du changement de mode plein écran:', error);
                alert('Erreur lors du changement de mode plein écran. Voir la console pour plus de détails.');
            }
        });
        
        // Mettre à jour l'état de l'application
        function updateAppStatus(status) {
            const statusElement = document.getElementById('app-status');
            if (statusElement) {
                statusElement.textContent = status;
            }
        }
        
        // Écouter les changements d'état globaux
        window.addEventListener('app-state-change', function(e) {
            updateAppStatus(e.detail.status);
        });
        
        // Initialiser le statut
        setTimeout(() => {
            updateAppStatus('Application en cours de chargement...');
        }, 1000);
    </script>
</body>
</html>
