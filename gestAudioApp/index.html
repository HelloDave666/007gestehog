<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Heart Of Glass</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="assets/css/narrative.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Heart Of Glass</h1>
        
        <!-- Système d'onglets -->
        <div class="tabs">
            <button class="tab-button active" data-tab="mainTab">Heart Of Glass : Rita's adventure</button>
            <button class="tab-button" data-tab="bluetoothTab">Blue Tools</button>
            <button class="tab-button" data-tab="knowledgeTab">Knowledge Of Action</button>
            <button class="tab-button" data-tab="soundTab">Sound Control to Major Tom</button>
        </div>
        
        <!-- Contenu des onglets -->
        
        <!-- Onglet principal - Heart Of Glass -->
        <div id="mainTab" class="tab-content active">
            <!-- Le système narratif sera injecté ici par narrativeSystem.js -->
        </div>
        
        <!-- Onglet Bluetooth - Blue Tools -->
        <div id="bluetoothTab" class="tab-content">
            <div class="bluetooth-section">
                <button id="scanButton">Rechercher les capteurs</button>
                <div id="deviceList" class="device-list">
                    <!-- Les informations sur les capteurs seront ajoutées ici par JavaScript -->
                </div>
            </div>
        </div>
        
        <!-- Onglet Knowledge - Knowledge Of Action -->
        <div id="knowledgeTab" class="tab-content">
            <div class="knowledge-content">
                <!-- Contenu futur à développer -->
                <h2>Espace de connaissances</h2>
                <p>Cette section est réservée pour le développement futur d'un espace de documentation et d'apprentissage.</p>
            </div>
        </div>
        
        <!-- Onglet Audio - Sound Control to Major Tom -->
        <div id="soundTab" class="tab-content">
            <div class="audio-section">
                <div class="file-input-container">
                    <label for="audioFile">Sélectionner un fichier audio :</label>
                    <input type="file" id="audioFile" accept="audio/*">
                </div>
                
                <div id="audioControls">
                    <div class="controls-container">
                        <button id="playPauseButton" class="play-button">
                            <span class="play-icon"><i class="fas fa-play"></i></span>
                            <span class="pause-icon" style="display: none;"><i class="fas fa-pause"></i></span>
                        </button>
                        
                        <button id="recordButton" class="record-button" disabled>
                            <i class="fas fa-microphone"></i> Enregistrer
                        </button>
                        <div id="recordingStatus" class="recording-status" style="display: none;">00:00</div>
                    </div>
                    
                    <div id="timelineContainer">
                        <div id="timelineBackground"></div>
                        <div id="timelineProgress"></div>
                        <div id="timelineHandle"></div>
                    </div>
                    
                    <div class="info-container">
                        <p id="positionDisplay" class="display-text">00:00 / 00:00</p>
                        <p id="speedDisplay" class="display-text">Vitesse: 1.00x (avant)</p>
                        <p id="volumeDisplay" class="display-text">Volume: 50%</p>
                    </div>
                    
                    <div class="loop-container">
                        <input type="checkbox" id="loopCheckbox" checked>
                        <label for="loopCheckbox">Lecture en boucle</label>
                    </div>
                    
                    <p id="audioStatus" class="status-text">État: En attente</p>
                    
                    <div class="sensitivity-control">
                        <h3>Sensibilité des capteurs</h3>
                        <div class="sensitivity-slider-container">
                            <input type="range" id="sensitivitySlider" min="0.1" max="3.0" step="0.1" value="1.0">
                            <span id="sensitivityValue" class="sensitivity-value">1.0</span>
                        </div>
                    </div>
                    
                    <div class="advanced-settings">
                        <h3>Paramètres avancés</h3>
                        <div class="setting-item">
                            <label for="grainSizeInput">Taille de grain (ms):</label>
                            <input type="number" id="grainSizeInput" min="50" max="1000" step="10" value="350">
                        </div>
                        <div class="setting-item">
                            <label for="overlapInput">Chevauchement (%):</label>
                            <input type="number" id="overlapInput" min="0" max="99" step="1" value="92">
                        </div>
                        <div class="setting-item">
                            <label for="windowTypeSelect">Type de fenêtre:</label>
                            <select id="windowTypeSelect">
                                <option value="hann">Hann</option>
                                <option value="hamming">Hamming</option>
                                <option value="rectangle">Rectangle</option>
                                <option value="triangle">Triangle</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- La section des paramètres de capteurs sera ajoutée ici par JavaScript -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Note: Le système de dialogue pour Heart Of Glass est maintenant géré par narrativeSystem.js -->
    
    <script src="src/renderer/renderer.js"></script>
</body>
</html>
